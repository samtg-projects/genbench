<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsplat-service · test</title>
<style>
  :root { color-scheme: dark; --bg:#111214; --panel:#1a1c20; --line:#2c2f36; --text:#e8e8ea; --dim:#9a9ca3; --accent:#7cc4ff; --bad:#ff8a80; --ok:#9be39b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; } p.sub { color:var(--dim); margin:0 0 22px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  label { display:block; color:var(--dim); font-size:13px; margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:#0d0e10; color:var(--text); font:inherit; }
  .row { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--dim); cursor:pointer; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop img { max-height: 220px; max-width: 100%; display:block; margin: 0 auto 8px; border-radius:6px; }
  button { margin-top:14px; padding:10px 18px; border-radius:8px; border:0; background:var(--accent); color:#06121d; font-weight:600; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-family: ui-monospace, Menlo, monospace; font-size:13px; white-space:pre-wrap; color:var(--dim); margin-top:10px; }
  .bad { color:var(--bad); } .ok { color:var(--ok); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; } .grid figure { margin:0; } figcaption { color:var(--dim); font-size:13px; margin-top:4px; }
  .grid img, .wide img { width:100%; border-radius:6px; background:#000; display:block; }
  .wide { margin-top:12px; } a { color: var(--accent); }
  .hint { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>tsplat-service</h1>
  <p class="sub">TripoSplat <code>d8db9e0</code>: one image in, a 262k-Gaussian splat out. Your image and the results stay under your own samcloud identity.</p>

  <section>
    <label for="tok">Your samcloud token (kept only in this tab's session storage; sent only to this service)</label>
    <input id="tok" type="password" autocomplete="off" placeholder="paste the token from ~/.samcloud/token">
    <div class="status" id="who"></div>
  </section>

  <section>
    <div class="drop" id="drop">Drop an image here, or click to choose<br><span class="hint">Best: one object on a plain background. Scenes come out as front-facing dioramas.</span></div>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <div class="row">
      <div><label for="fid">…or an existing files-plane id</label><input id="fid" type="number" min="1" placeholder="e.g. 3367"></div>
      <div><label for="matte">Matte</label>
        <select id="matte"><option value="auto">auto: cut out the subject; whole frame if none found</option><option value="opaque">opaque: whole frame as a relief</option><option value="rgba">rgba: use the image's own alpha</option></select></div>
      <div><label for="rt">Deliver to task # (you and the service must be able to read it)</label><input id="rt" type="number" min="1" value="1399"></div>
      <div><label for="pub">Registry</label>
        <select id="pub"><option value="">don't publish</option><option value="1">publish a draft bundle to "tsplat drafts"</option></select></div>
    </div>
    <button id="go">Make a splat</button>
    <div class="status" id="st"></div>
  </section>

  <section id="out" hidden>
    <div class="grid">
      <figure><img id="prep" alt=""><figcaption>What TripoSplat saw (after the matte)</figcaption></figure>
      <figure><img id="beauty" alt=""><figcaption>Beauty shot (point-sprite preview, not the headset look)</figcaption></figure>
    </div>
    <div class="wide"><img id="sheet" alt=""><div class="hint">Four views around the splat</div></div>
    <p id="links"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const tok = $("tok"); tok.value = sessionStorage.getItem("tsplat_tok") || "";
const H = () => ({ "Authorization": "Bearer " + tok.value.trim().replace(/^Bearer\s+/i, "").replace(/^Authorization:\s*Bearer\s+/i, "") });
let picked = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...H(), ...(opts.headers || {}) } });
  const ct = r.headers.get("Content-Type") || "";
  const body = ct.includes("json") ? await r.json() : await r.blob();
  if (!r.ok) throw new Error((body && body.error) || ("HTTP " + r.status));
  return body;
}
async function check() {
  sessionStorage.setItem("tsplat_tok", tok.value.trim());
  if (!tok.value.trim()) { $("who").textContent = ""; return; }
  try { const h = await api("/health"); $("who").textContent = `token ok · service ${h.version} · ${h.model_loaded ? "model warm" : "model cold (the first job loads it)"} · queue ${h.queue_depth}`; }
  catch (e) { $("who").textContent = e.message; $("who").className = "status bad"; return; }
  $("who").className = "status";
}
tok.addEventListener("change", check); check();

const drop = $("drop");
drop.onclick = () => $("file").click();
$("file").onchange = e => pick(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };
function pick(f) {
  if (!f) return; picked = f; $("fid").value = "";
  drop.textContent = ""; const im = document.createElement("img"); im.src = URL.createObjectURL(f);
  const nm = document.createElement("span"); nm.textContent = f.name; drop.append(im, nm);
}

async function show(id, fileId) { if (fileId) $(id).src = URL.createObjectURL(await api(`/v1/files/${fileId}/raw`)); }
const say = (t, cls) => { const st = $("st"); st.textContent = t; st.className = "status" + (cls ? " " + cls : ""); };

$("go").onclick = async () => {
  $("go").disabled = true; $("out").hidden = true;
  try {
    let fileId = parseInt($("fid").value, 10);
    if (!fileId) {
      if (!picked) throw new Error("choose an image or give a file id");
      say("uploading your image…");
      fileId = (await api(`/v1/upload?name=${encodeURIComponent(picked.name)}`, { method: "POST", body: picked, headers: { "Content-Type": picked.type || "image/png" } })).file_id;
    }
    const body = { file_id: fileId, matte: $("matte").value, reply_to: { kind: "task", id: parseInt($("rt").value, 10) } };
    if ($("pub").value) body.publish = {};
    let j = await api("/v1/splat", { method: "POST", body: JSON.stringify(body), headers: { "Content-Type": "application/json", "Idempotency-Key": "ui-" + crypto.randomUUID() } });
    const t0 = Date.now();
    while (j.state === "queued" || j.state === "running") {
      say(`job ${j.id}: ${j.state} · ${Math.round((Date.now() - t0) / 1000)} s\n(Obelisk's GPU is shared with model inference, so a wait in the queue is normal.)`);
      j = await api(`/v1/jobs/${j.id}/wait?timeout_s=60`);
    }
    if (j.state !== "done") throw new Error(j.error || j.state);
    const r = j.result, t = j.timings;
    say(`done · splat ${t.splat_s} s · matte ${r.matte_used} · queue wait ${t.lease_wait_s} s`, "ok");
    $("out").hidden = false;
    await Promise.all([show("prep", r.prepared_file_id), show("beauty", r.beauty_file_id), show("sheet", r.sheet_file_id)]);
    const ply = await api(`/v1/files/${r.ply_file_id}/raw`);
    const links = $("links"); links.textContent = "";
    const a = document.createElement("a"); a.download = `tsplat-${fileId}.ply`; a.href = URL.createObjectURL(ply); a.textContent = "Download the PLY";
    links.append(a, ` (${(ply.size / 1e6).toFixed(1)} MB, y-down, view -1,0,0) · files ${r.ply_file_id}, ${r.beauty_file_id}, ${r.sheet_file_id}, linked to task ${body.reply_to.id}`);
    if (r.registry) { const reg = document.createElement("span"); reg.id = "reg"; links.append(document.createElement("br"), "Registry: ", reg); }
    if (r.registry) $("reg").textContent = r.registry.state;
    if (r.registry && r.registry.state === "converting") {
      for (let i = 0; i < 120; i++) {
        await new Promise(res => setTimeout(res, 15000));
        const rr = (await api(`/v1/jobs/${j.id}`)).result.registry;
        $("reg").textContent = rr.state === "published" ? `published, draft bundle ${rr.bundle}` : rr.state === "failed" ? `failed: ${rr.error}` : `${rr.state}…`;
        if (rr.state !== "converting") break;
      }
    } else if (r.registry && r.registry.state === "failed") { $("reg").textContent = `failed: ${r.registry.error}`; }
  } catch (e) { say(e.message, "bad"); }
  finally { $("go").disabled = false; }
};
</script>
</body>
</html>
